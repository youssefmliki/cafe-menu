name: Sync Menu Haut

# Tunisia = UTC+1 (no DST):
# 17:00 Tunis = 16:00 UTC | 00:00 Tunis = 23:00 UTC
# GitHub cron can lag 5–20 min, so we fire at the hour and keep a 10-min backup.
on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "10 16 * * *"
    - cron: "0 23 * * *"
    - cron: "10 23 * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-menu]
  push:
    branches: [main]
    paths:
      - "source/**"
      - "MENU_BAS.pdf"
      - "scripts/sync_menu_haut.py"
      - ".github/workflows/sync-menu-haut.yml"

permissions:
  contents: write

concurrency:
  group: sync-menu-haut
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync published MENU_HAUT.pdf
        run: python3 scripts/sync_menu_haut.py

      - name: Commit if the public menu changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MENU_HAUT.pdf
          if git diff --cached --quiet; then
            echo "MENU_HAUT.pdf already matches the current time slot"
            exit 0
          fi
          git commit -m "Sync MENU_HAUT.pdf for current Tunisia time"
          git pull --rebase --autostash origin main
          git push
