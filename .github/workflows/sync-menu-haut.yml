name: Sync Menu Haut

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 16 * * *"
    - cron: "0 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [sync-menu]
  push:
    branches: [main]
    paths:
      - "source/**"
      - "MENU_BAS.pdf"
      - "scripts/sync_menu_haut.py"
      - ".github/workflows/sync-menu-haut.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-menu-haut
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync published MENU_HAUT.pdf
        run: python3 scripts/sync_menu_haut.py

      - name: Commit if the public menu changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MENU_HAUT.pdf
          if git diff --cached --quiet; then
            echo "MENU_HAUT.pdf already matches the current time slot"
            exit 0
          fi
          git commit -m "Sync MENU_HAUT.pdf for current Tunisia time"
          git pull --rebase --autostash origin main
          git push

      - name: Queue the next check
        env:
          GH_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MENU_SYNC_TOKEN missing — schedule/keep-alive will still retry"
            exit 0
          fi
          sleep 90
          gh workflow run "Sync Menu Haut" --repo youssefmliki/cafe-menu --ref main
