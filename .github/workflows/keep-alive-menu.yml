name: Keep Menu Sync Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger menu sync
        env:
          GH_TOKEN: ${{ secrets.MENU_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "MENU_SYNC_TOKEN is missing"
            exit 1
          fi
          gh workflow run "Sync Menu Haut" --repo youssefmliki/cafe-menu --ref main
