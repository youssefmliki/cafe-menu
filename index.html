<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Nahawand — Menu</title>
  <style>
    :root {
      color: #111;
      background: #f6f3ee;
      font-family: Georgia, "Times New Roman", serif;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.7rem; }
    p { margin: 0 0 18px; color: #555; line-height: 1.45; }
    a {
      display: block;
      margin-top: 10px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #111;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nahawand</h1>
    <p>Choisissez le menu de la salle.</p>
    <a href="MENU_BAS.pdf">Menu Bas</a>
    <a href="MENU_HAUT.pdf">Menu Haut</a>
  </main>
</body>
</html>
